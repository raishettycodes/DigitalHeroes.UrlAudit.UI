<div
  class="table-container"
  *ngIf="!loading && history.length > 0">

  <table mat-table [dataSource]="history">

    <!-- Date -->
    <ng-container matColumnDef="createdAt">

      <th mat-header-cell *matHeaderCellDef>
        Date
      </th>

      <td mat-cell *matCellDef="let audit">
        {{ audit.createdAt | date:'dd MMM yyyy, HH:mm' }}
      </td>

    </ng-container>


    <!-- Website -->
    <ng-container matColumnDef="url">

      <th mat-header-cell *matHeaderCellDef>
        Website
      </th>

      <td mat-cell *matCellDef="let audit">

        <div class="url-cell">
          <strong>
            {{ audit.url }}
          </strong>
        </div>

      </td>

    </ng-container>


    <!-- HTTP -->
    <ng-container matColumnDef="statusCode">

      <th mat-header-cell *matHeaderCellDef>
        HTTP
      </th>

      <td mat-cell *matCellDef="let audit">

        <span class="http-code">
          {{ audit.statusCode }}
        </span>

      </td>

    </ng-container>


    <!-- Response -->
    <ng-container matColumnDef="responseTimeMs">

      <th mat-header-cell *matHeaderCellDef>
        Time
      </th>

      <td mat-cell *matCellDef="let audit">
        {{ audit.responseTimeMs }} ms
      </td>

    </ng-container>


    <!-- SEO -->
    <ng-container matColumnDef="seoScore">

      <th mat-header-cell *matHeaderCellDef>
        SEO
      </th>

      <td mat-cell *matCellDef="let audit">

        <span class="seo-score">
          {{ audit.seoScore ?? 0 }}/100
        </span>

      </td>

    </ng-container>


    <!-- Status -->
    <ng-container matColumnDef="status">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let audit">

        <span
          class="status-badge"
          [class.success]="audit.isReachable"
          [class.failed]="!audit.isReachable">

          <mat-icon>
            {{ audit.isReachable ? 'check_circle' : 'error' }}
          </mat-icon>

          {{ getStatusText(audit) }}

        </span>

      </td>

    </ng-container>


    <!-- ACTION -->
    <ng-container matColumnDef="action">

      <th mat-header-cell *matHeaderCellDef>
        Action
      </th>

      <td mat-cell *matCellDef="let audit">

        <button
          mat-stroked-button
          type="button"
          (click)="viewAudit(audit); $event.stopPropagation()">

          <mat-icon>visibility</mat-icon>

          View

        </button>

      </td>

    </ng-container>
  <ng-container matColumnDef="action">

  <th mat-header-cell *matHeaderCellDef>
    Action
  </th>

  <td
    mat-cell
    *matCellDef="let audit"
    class="action-cell">

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="viewAudit(audit)">

      <mat-icon>visibility</mat-icon>

      View

    </button>

    <button
      mat-icon-button
      color="warn"
      type="button"
      matTooltip="Delete audit"
      (click)="deleteAudit(audit.id)">

      <mat-icon>delete</mat-icon>

    </button>

  </td>

</ng-container>

  </td>

</ng-container>


    <!-- Header -->
    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>


    <!-- Rows -->
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;"
      class="audit-row">
    </tr>

  </table>

</div>
